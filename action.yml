name: 'locale-lint'
description: 'Compiler-error-grade localization linter. Catches script contamination (Hans-vs-Hant, Russian-in-Belarusian, ...) and vocabulary leakage (en-US-in-en-GB, ...) before they ship.'
author: 'digitalby'
branding:
  icon: 'check-circle'
  color: 'red'

inputs:
  root:
    description: 'Root directory to scan'
    required: false
    default: '.'
  config:
    description: 'Path to a .locale-lint.yml config file (optional; .zh-lint.yml accepted as fallback)'
    required: false
  format:
    description: 'Output format (xcode, github, plain, json)'
    required: false
    default: 'github'
  version:
    description: 'locale-lint core version'
    required: false
    default: 'latest'
  plugins:
    description: 'Space-separated list of plugin packages to install (e.g. "@digitalby/locale-lint-chinese @digitalby/locale-lint-cyrillic"). At least one is required.'
    required: false
    default: '@digitalby/locale-lint-chinese'

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Run locale-lint
      shell: bash
      env:
        LL_ROOT: ${{ inputs.root }}
        LL_FORMAT: ${{ inputs.format }}
        LL_CONFIG: ${{ inputs.config }}
        LL_VERSION: ${{ inputs.version }}
        LL_PLUGINS: ${{ inputs.plugins }}
      run: |
        npm_args=("-p" "@digitalby/locale-lint@${LL_VERSION}")
        for p in ${LL_PLUGINS}; do
          npm_args+=("-p" "$p")
        done
        cli_args=("$LL_ROOT" "--format=$LL_FORMAT")
        if [ -n "$LL_CONFIG" ]; then
          cli_args+=("--config=$LL_CONFIG")
        fi
        npx --yes "${npm_args[@]}" locale-lint "${cli_args[@]}"
